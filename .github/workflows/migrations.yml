name: Migrations

# A pull request that changes the multiplayer template's project files (package.json scripts and dependencies,
# config files, index.html) needs a `mavonengine upgrade` migration, so projects made from the template before get the
# change too. Or `[no migration]` in its description when they don't need it. See scripts/check-migrations.mjs.
#
# Its own workflow so that editing the description runs only this check again, not the whole build.
on:
  pull_request:
    branches: [ "main", "dev" ]
    types: [ opened, synchronize, reopened, edited ]

jobs:
  check:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    # The whole history, for the merge base with the target branch
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Use Node.js 24.x
      uses: actions/setup-node@v7
      with:
        node-version: 24.x

    # The description only reaches the script as true or false
    - name: Template changes come with a migration
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        MIGRATION_CHECK_SKIP: ${{ contains(github.event.pull_request.body, '[no migration]') }}
      run: node scripts/check-migrations.mjs "$BASE_SHA" HEAD
