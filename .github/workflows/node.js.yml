name: Node.js CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build:

    runs-on: ${{ matrix.os }}

    permissions:
      # Required to checkout the code
      contents: read

    strategy:
      matrix:
        node-version: [24.x]
        os: [ubuntu-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: |
          package-lock.json
          packages/multiplayer-template/package-lock.json
    
    - name: Build and test
      run: |
        npm ci
        npm run build
        npm run test

    - name: Lint
      run: npm run lint

    - name: Typecheck bootstrap
      run: npm run typecheck
      working-directory: ./packages/bootstrap

    # Needs core's dist from the build step, the snapshot types come from there
    - name: Typecheck cli
      run: npm run typecheck
      working-directory: ./packages/cli

    - name: Typecheck http-monitoring plugin
      run: npm run typecheck
      working-directory: ./packages/plugins/http-monitoring

    # Run the built file directly: npm ci runs before the build, so npm skipped
    # linking the `mavonengine` bin (its target didn't exist yet) and npx would
    # fall back to looking it up on the registry
    - name: Smoke test cli binary
      run: |
        node dist/index.js --version
        node dist/index.js --help
        node dist/index.js dashboard --help
      working-directory: ./packages/cli

    - name: npm link core locally
      run: |
        npm link
      working-directory: ./packages/core

    # multiplayer-template has its own nested workspaces (client/server) that npm
    # workspaces does not handle recursively, so we need a separate npm ci here
    - name: Build multiplayer-template
      run: |
        npm link @mavonengine/core
        npm run typecheck
        npm run build
        npm run lint
      working-directory: ./packages/multiplayer-template

    - name: Start dev servers and verify startup
      timeout-minutes: 1
      run: npx concurrently --kill-others --success first "npm run dev" "npx wait-on http://localhost:8050/api/game/health --timeout 20000"
      working-directory: ./packages/multiplayer-template

    # Installs e2e/plugin/hello-plugin into the template with `mavonengine install`, then checks it on the
    # dev server, in `mavonengine build`'s release and on the production server. Uses an npm stub for the
    # install, since a real one would replace the npm-linked @mavonengine/core
    - name: Plugin end-to-end test
      timeout-minutes: 5
      run: npm run test:plugin-e2e

    # Boots the template's game server in production with @mavonengine/http-monitoring and an htpasswd
    # login, then opens the dashboard in the runner's preinstalled Chrome and goes through every tab
    - name: Monitoring dashboard end-to-end test
      timeout-minutes: 5
      run: npm run test:monitoring-e2e

    - name: Upload monitoring dashboard screenshots
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: monitoring-e2e-screenshots-${{ matrix.os }}
        path: e2e/http-monitoring/screenshots
        if-no-files-found: ignore
